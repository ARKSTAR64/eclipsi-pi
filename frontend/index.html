    <meta name="apple-mobile-web-app-status-bar-style" content="default">

        <!-- Configurações PWA -->

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch((error) => {
        console.error('Erro ao registrar o Service Worker:', error);
      });
    });
  }
</script>

        </div>

        <div class="register-option">
            <button class="option-register" onclick="makeLogin()">Fazer login</button>
            <button class="option-register" onclick="makeRegister()">Fazer um cadastro</button>
            <p class="register-p">Ja fez um cadastro? <a href="/pages/login.html" class="register-link">Clique aqui!</a></p>
        </div>
    </main>
</body>
</html>
