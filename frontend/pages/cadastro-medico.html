<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do Profissional - Saúde Mental</title>

    <link rel="stylesheet" href="../css/cadastro.css">
    <script src="../js/api.js" defer></script>
</head>
<body>
    
    <main class="container">
        <div class="logo-tittle">
            <img src="./src/images/tela-protoripo.png" alt="Logo da plataforma" class="logo">
            <h2 class="title">Cadastro do Profissional</h2>
            <p class="subtitle">Exclusivo para especialistas em Saúde Mental</p>
        </div>

        <div class="register">
            <form action="" class="register-form" id="registerForm" method="POST">
                
                <!-- Nome Completo -->
                <div class="sentence-line">
                    <input type="text" id="name" class="register-input" placeholder="Nome Completo" required>
                </div>

                <!-- E-mail Professional -->
                <div class="sentence-line">
                    <input type="email" id="email" class="register-input" placeholder="E-mail profissional" required>
                </div>

                <!-- Telefone / WhatsApp -->
                <div class="sentence-line">
                    <input type="tel" id="phone" class="register-input" placeholder="Telefone / WhatsApp (DD + número)" required>
                </div>

                <!-- Especialidade / Profissão -->
                <div class="sentence-line">
                    <select id="specialty" class="register-input register-select" required>
                        <option value="" disabled selected>Selecione sua especialidade</option>
                        <option value="psiquiatra">Psiquiatra</option>
                        <option value="psicologo">Psicólogo(a)</option>
                        <option value="psicanalista">Psicanalista</option>
                        <option value="neuropsicologo">Neuropsicólogo(a)</option>
                        <option value="outro">Outro profissional de Saúde Mental</option>
                    </select>
                </div>

                <!-- Grupo para Conselho e UF lado a lado -->
                <div class="form-row">
                    <div class="sentence-line">
                        <input type="text" id="council-number" class="register-input" placeholder="Nº do Registro (CRM / CRP / etc)" required>
                    </div>
                    <div class="sentence-line sentence-line-sm">
                        <select id="council-uf" class="register-input register-select" required>
                            <option value="" disabled selected>UF</option>
                            <option value="AC">AC</option><option value="AL">AL</option><option value="AP">AP</option>
                            <option value="AM">AM</option><option value="BA">BA</option><option value="CE">CE</option>
                            <option value="DF">DF</option><option value="ES">ES</option><option value="GO">GO</option>
                            <option value="MA">MA</option><option value="MT">MT</option><option value="MS">MS</option>
                            <option value="MG">MG</option><option value="PA">PA</option><option value="PB">PB</option>
                            <option value="PR">PR</option><option value="PE">PE</option><option value="PI">PI</option>
                            <option value="RJ">RJ</option><option value="RN">RN</option><option value="RS">RS</option>
                            <option value="RO">RO</option><option value="RR">RR</option><option value="SC">SC</option>
                            <option value="SP">SP</option><option value="SE">SE</option><option value="TO">TO</option>
                        </select>
                    </div>
                </div>

                <!-- Senha -->
                <div class="sentence-line">
                    <input type="password" id="password" class="register-input" placeholder="Crie uma senha" required>
                </div>

                <!-- Confirmação de Senha -->
                <div class="sentence-line">
                    <input type="password" id="confirm-password" class="register-input" placeholder="Confirme sua senha" required>
                </div>

                <!-- Botão e Link de Login -->
                <div class="btn-line">
                    <button class="register-btn" type="submit">Cadastrar Profissional</button>
                    <p class="register-p">Já possui conta? <a href="./login.html" class="register-link">Clique aqui!</a></p>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
