<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/api.js"></script>
</head>
<body>
    
    <main class="container">
        <div class="logo-tittle">
            <img src="./src/images/tela-protoripo.png" alt="Tela de prototipação" class="logo">
            <h2 class="title">Login</h2>
        </div>

        <div class="register">
            <form action="" class="register-form" id="registerForm">
                <div class="sentence-line">
                    <input type="text" id="email" class="register-input" placeholder="Coloque seu email" required>
                </div>
                <div class="sentence-line">
                    <input type="password" id="password" class="register-input" placeholder="Coloque sua senha" required >
                </div>

                <div class="btn-line">
                    <button class="register-btn" type="submit">Entrar</button>
                    <button class="back-btn" type="button" onclick="history.back()">Voltar</button>
                    <p class="register-p">Já fez um cadastro? <a href="../index.html" class="register-link">Clique aqui!</a></p>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
