<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6c5ce7">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script src="/js/pwa.js" defer></script>
</head>
<body>
    
    <main class="container">
        <div class="logo-tittle">
            <img src="./images/logo-ruim.png" alt="Logo" class="logo">
            <h2 class="title">Login</h2>
        </div>

        <div class="register">
            <form class="register-form" id="registerForm">
                <div class="sentence-line">
                    <input type="email" id="email" class="register-input" placeholder="Digite seu e-mail" required>
                </div>
                <div class="sentence-line">
                    <input type="password" id="password" class="register-input" placeholder="Digite sua senha" required>
                </div>

                <div class="btn-line">
                    <button class="register-btn" type="submit">Entrar</button>
                    <button class="back-btn" type="button" onclick="window.location.href='/'">Voltar</button>
                    <p class="register-p">Ainda não tem conta? <a href="/pages/cadastro.html" class="register-link">Cadastre-se</a></p>
                </div>
            </form>
        </div>
    </main>

    <script src="../js/api.js"></script>
</body>
</html>
