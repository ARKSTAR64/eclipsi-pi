<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - EcliPsi</title>

    <link rel="stylesheet" href="/css/cadastro.css">
    <script src="/js/api.js" defer></script>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6c5ce7">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <script src="/js/pwa.js" defer></script>
</head>
<body>
    
    <main class="container">
        <div class="logo-tittle">
            <img src="../images/logo-ruim.png" alt="Tela de prototipação" class="logo">
            <h2 class="title">Cadastro</h2>
        </div>

        <div class="register">
            <form class="register-form" id="form-user" method="POST">
                <!-- Nome -->
                <div class="sentence-line">
                    <input type="text" id="name" class="register-input" placeholder="Coloque seu nome" required>
                </div>

                <!-- E-mail -->
                <div class="sentence-line">
                    <input type="email" id="email" class="register-input" placeholder="Coloque seu email" required>
                </div>

                <!-- Telefone -->
                <div class="sentence-line">
                    <input type="tel" id="phone" class="register-input" placeholder="Telefone / WhatsApp (DD + número)">
                </div>

                <!-- Idade e Gênero (Lado a lado) -->
                <div class="form-row" style="display: flex; gap: 10px;">
                    <div class="sentence-line" style="flex: 1;">
                        <input type="number" id="age" class="register-input" placeholder="Idade" min="1" max="120">
                    </div>
                    <div class="sentence-line" style="flex: 1;">
                        <select id="gender" class="register-input register-select">
                            <option value="" disabled selected>Gênero</option>
                            <option value="Feminino">Feminino</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Outro">Outro / Prefiro não dizer</option>
                        </select>
                    </div>
                </div>

                <!-- Senha -->
                <div class="sentence-line">
                    <input type="password" id="password" class="register-input" placeholder="Coloque sua senha" required>
                </div>

                <!-- Confirmação de Senha -->
                <div class="sentence-line">
                    <input type="password" id="confirm-password" class="register-input" placeholder="Confirme sua senha" required>
                </div>

                <div class="btn-line">
                    <button class="register-btn" type="submit">Cadastrar-se!</button>
                    <button class="back-btn" type="button" onclick="history.back()">Voltar</button>
                    <p class="register-p">Já fez um cadastro? <a href="/pages/login.html" class="register-link">Clique aqui!</a></p>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
